appId: com.hiwebtalk.desktop
productName: Hi Web Talk
copyright: Copyright © 2026

files:
  - electron/**/*
  - package.json

directories:
  output: release

extraMetadata:
  main: electron/main.js

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Network
