<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Web Talk 启动器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #111112;
  color: #e4e4e7;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.container { text-align: center; max-width: 480px; width: 90%; }
h1 {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #818cf8, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle { font-size: 14px; color: #71717a; margin-bottom: 32px; }
.modes { display: flex; gap: 12px; margin-bottom: 24px; }
.mode-card {
  flex: 1;
  padding: 20px 16px;
  border: 1.5px solid #27272a;
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  background: #18181b;
}
.mode-card:hover { border-color: #3f3f46; }
.mode-card.active {
  border-color: #818cf8;
  background: #1e1e2e;
}
.mode-card .icon { font-size: 28px; margin-bottom: 10px; }
.mode-card .label { font-size: 15px; font-weight: 500; }
.mode-card .desc { font-size: 12px; color: #71717a; margin-top: 6px; }
#remote-url {
  display: none;
  margin-bottom: 24px;
}
#remote-url input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #27272a;
  border-radius: 8px;
  background: #18181b;
  color: #e4e4e7;
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}
#remote-url input:focus { border-color: #818cf8; }
#remote-url input::placeholder { color: #52525b; }
button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #818cf8, #a78bfa);
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity .2s;
}
button:hover { opacity: .9; }
button:disabled { opacity: .4; cursor: not-allowed; }
.error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; min-height: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>Hi Web Talk</h1>
  <p class="subtitle">选择运行模式</p>

  <div class="modes">
    <div class="mode-card active" data-mode="local" onclick="selectMode('local')">
      <div class="icon">🖥️</div>
      <div class="label">本地模式</div>
      <div class="desc">启动内置服务端，数据存储在本地</div>
    </div>
    <div class="mode-card" data-mode="remote" onclick="selectMode('remote')">
      <div class="icon">🌐</div>
      <div class="label">远程连接</div>
      <div class="desc">连接已部署的 Docker / 远程服务端</div>
    </div>
  </div>

  <div id="remote-url">
    <input id="url-input" type="url" placeholder="http://你的服务器地址:8787" value="http://127.0.0.1:8787">
  </div>

  <button id="launch-btn" onclick="launch()">启动</button>
  <p id="error-msg" class="error-msg"></p>
</div>

<script>
let currentMode = 'local';

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-card').forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
  document.getElementById('remote-url').style.display = mode === 'remote' ? 'block' : 'none';
  document.getElementById('error-msg').textContent = '';
}

function launch() {
  let url = '';
  if (currentMode === 'remote') {
    url = document.getElementById('url-input').value.trim();
    if (!url) {
      document.getElementById('error-msg').textContent = '请输入远程服务器地址';
      return;
    }
    try { new URL(url); } catch { document.getElementById('error-msg').textContent = '地址格式无效，需以 http:// 或 https:// 开头'; return; }
  }
  document.getElementById('launch-btn').disabled = true;
  document.getElementById('launch-btn').textContent = '启动中...';
  document.getElementById('error-msg').textContent = '';
  window.hiWebTalkDesktop.submitLauncher({ mode: currentMode, remoteUrl: url });
}

// listen for errors from main process (launcher stays open on failure)
window.hiWebTalkDesktop.onLauncherError((msg) => {
  document.getElementById('launch-btn').disabled = false;
  document.getElementById('launch-btn').textContent = '启动';
  document.getElementById('error-msg').textContent = '启动失败：' + msg;
});

// restore saved preference (URL, last mode)
window.hiWebTalkDesktop.onLauncherPreference((pref) => {
  if (pref.mode === 'remote' && pref.remoteUrl) {
    document.getElementById('url-input').value = pref.remoteUrl;
    selectMode('remote');
  } else if (pref.mode === 'remote') {
    selectMode('remote');
  }
  // local mode is the default — nothing to restore
});
</script>
</script>
</body>
</html>
