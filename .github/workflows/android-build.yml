name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Android SDK & NDK
        timeout-minutes: 8
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.31.5"

      - name: Deploy Android node project
        run: node scripts/deploy-android.mjs

      - name: Build APK
        timeout-minutes: 15
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hi-Web-Talk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
