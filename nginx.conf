# hi-web-talk Nginx 配置（生产部署用）
# 使用方式：复制到 /etc/nginx/sites-available/，创建软链到 sites-enabled/

server {
    listen 80;
    server_name your-domain.com;

    # 如果有 SSL 证书，取消下面注释
    # listen 443 ssl http2;
    # ssl_certificate     /etc/ssl/certs/your-domain.crt;
    # ssl_certificate_key /etc/ssl/private/your-domain.key;
    #
    # if ($scheme = http) {
    #     return 301 https://$server_name$request_uri;
    # }

    root /var/www/hi-web-talk/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/event-stream;
    gzip_min_length 512;
    gzip_vary on;

    # 代理 /api 到 Express
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # SSE 流式传输必须的头
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: 非 /api 请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
